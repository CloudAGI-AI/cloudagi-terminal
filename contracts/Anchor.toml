[toolchain]
anchor_version = "0.32.0"

[features]
resolution = true
skip-lint = false

[programs.devnet]
mandate-intent = "11111111111111111111111111111111"
receipt-mint   = "11111111111111111111111111111111"
escrow-stake   = "11111111111111111111111111111111"
# TODO: replace placeholder IDs with real declare_id! values after first `anchor build` + deploy

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
# Wallet resolved from env at runtime; set ANCHOR_WALLET=/path/to/keypair.json
wallet   = "${ANCHOR_WALLET}"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = [
    "programs/*",
]
