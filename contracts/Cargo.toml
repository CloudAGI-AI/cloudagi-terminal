[workspace]
members  = ["programs/*"]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "^0.32", features = ["init-if-needed"] }
anchor-spl  = { version = "^0.32", features = ["token"] }
solana-program = "^2.1"
mpl-bubblegum  = "^1"
spl-account-compression = { version = "^0.4", features = ["cpi"] }
spl-noop = "^0.2"

[profile.release]
overflow-checks = true
lto             = "thin"
codegen-units   = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
